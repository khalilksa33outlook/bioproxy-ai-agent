<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IICC Group Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i class="fas fa-microchip text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">IICC <span class="text-blue-400">AI COMMAND</span></h1>
            </div>
            <div class="text-sm text-slate-400 hidden md:block">
                <i class="fas fa-location-dot mr-2"></i> Madinah Host | 16 Sectors Active
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <div id="chat-container" class="space-y-6 mb-24 min-h-[60vh]">
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-sm max-w-[80%]">
                <p class="text-sm font-semibold text-blue-400 mb-1">SYSTEM</p>
                <p>Welcome, CEO. I am connected to the ERP and your private documents. How can I assist with the group's operations today?</p>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent">
            <div class="max-w-4xl mx-auto relative">
                <input type="text" id="user-input" 
                    placeholder="Ask about finances, sectors, or employees..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-full py-4 pl-6 pr-16 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-2xl transition-all">
                <button onclick="sendQuery()" class="absolute right-2 top-2 bottom-2 bg-blue-600 hover:bg-blue-500 text-white px-6 rounded-full transition-colors">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        async function sendQuery() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const query = input.value.trim();
            if (!query) return;

            // User Message
            container.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-blue-600 p-4 rounded-2xl shadow-md max-w-[80%]">
                        <p>${query}</p>
                    </div>
                </div>`;
            
            input.value = '';
            window.scrollTo(0, document.body.scrollHeight);

            // API Call
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: query })
                });
                const data = await response.json();

                // Bot Response
                container.innerHTML += `
                    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-sm max-w-[90%]">
                        <p class="text-sm font-semibold text-blue-400 mb-1">AI ASSISTANT</p>
                        <p class="leading-relaxed">${data.answer}</p>
                        <div class="mt-3 flex flex-wrap gap-2">
                            ${data.sources.map(s => `<span class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-300">#${s.id}</span>`).join('')}
                        </div>
                    </div>`;
            } catch (err) {
                container.innerHTML += `<div class="text-red-400 text-center p-4">Error connecting to AI Host.</div>`;
            }
            window.scrollTo(0, document.body.scrollHeight);
        }

        // Handle Enter Key
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendQuery();
        });
    </script>
</body>
</html>
